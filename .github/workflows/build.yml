name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not|> |error:|Failed|requires" build.log | grep -v "^\s*at " | head -40 > err.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' err.txt | cut -c1-60000)
          echo "::error title=Build errors::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: Inquadra-apk
          path: app/build/outputs/apk/debug/*.apk

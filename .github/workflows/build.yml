name: Build

on:
  push:
  pull_request:
  workflow_dispatch:     # Actions > Build > Run workflow
    inputs:
      rilascia:
        description: "Pubblica la release con la versione scritta in iride.c (IRIDE_VERSION)"
        type: boolean
        default: false
  release:
    types: [published]   # Release creata dal sito: i file vengono aggiunti da soli

jobs:
  test:
    name: Test sul simulatore
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compila ed esegui i test
        run: |
          cd simulator
          mkdir -p out
          gcc -std=gnu99 -O1 -Wall -Wno-unused-function -Wno-unused-variable -Wno-format-truncation -Ishim -o preview preview.c -lm
          ./preview
      - name: Memoria e comportamenti indefiniti (AddressSanitizer + UBSan, 2 serie di tasti a caso)
        run: |
          cd simulator
          gcc -std=gnu99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -w -Ishim -o preview_asan preview.c -lm
          ASAN_OPTIONS=detect_leaks=0 IRIDE_FUZZ_SEED=1 IRIDE_FUZZ_N=8000 ./preview_asan > /dev/null
          ASAN_OPTIONS=detect_leaks=0 IRIDE_FUZZ_SEED=2026 IRIDE_FUZZ_N=8000 ./preview_asan | tail -1
      - name: Fusi orari a confronto col database IANA
        run: cd simulator && python3 check_tz.py
      - name: Formati di printf compatibili con la 6D
        run: python3 simulator/check_formats.py
      - name: Lettore delle sessioni per AstroStack
        run: python3 tools/astrostack/test_iride_session.py
      - name: Ricette della 6D in preset XMP
        run: python3 presets/test_ricetta.py
      - name: Cronistoria dal CHANGELOG
        run: python3 tools/cronistoria/genera.py

  build:
    name: Firmware per 6D 1.1.6
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          path: Iride6D
      - name: Toolchain ARM
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3-docutils zip
      - name: Magic Lantern (build ufficiale 6D del 20/06/2025)
        run: |
          git clone https://github.com/reticulatedpines/magiclantern_simplified ml
          cd ml
          git checkout ed3e7c0dfacfdeaf3349dee73edf9e3621217462
          cp -r ../Iride6D/module/iride modules/
          git apply ../Iride6D/module/magiclantern.patch
      - name: Compila
        run: cd ml/platform/6D.116 && make -j4
      - name: Pacchetto per la scheda SD
        run: |
          mkdir sd && cd sd
          unzip -q ../ml/platform/6D.116/build/magiclantern.zip
          mkdir -p ML/SETTINGS
          for m in IRIDE AUTOEXPO DEFLICK DUAL_ISO ETTR SILENT; do : > ML/SETTINGS/$m.EN; done
          cp ../Iride6D/docs/LEGGIMI.txt .
          cp ../Iride6D/docs/PROVA_6D.md PROVA_6D.txt
          zip -qr ../Iride6D-SD.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Iride6D-SD
          path: Iride6D-SD.zip

  release:
    name: Release su GitHub
    # tag scritto dal sito (anche "V1.3") oppure un clic su Run workflow con "Pubblica la release"
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || (github.event_name == 'workflow_dispatch' && inputs.rilascia)
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Iride6D-SD
      - name: Versione
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            # un clic: la versione e' quella del firmware, il tag lo crea la release
            V=$(sed -n 's/^#define IRIDE_VERSION "\(.*\)"/\1/p' module/iride/iride.c)
            [ -n "$V" ] || { echo "::error::IRIDE_VERSION non trovata in iride.c"; exit 1; }
            TAG="v$V"
            grep -q "^## $V " CHANGELOG.md || { echo "::error::Manca la sezione '## $V' nel CHANGELOG"; exit 1; }
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: File della release
        run: |
          V="${TAG#[vV]}"
          mkdir rel
          mv Iride6D-SD.zip "rel/Iride6D-$V-SD.zip"
          unzip -p "rel/Iride6D-$V-SD.zip" ML/modules/iride.mo > rel/iride.mo
          python3 presets/make_presets.py presets_out
          cp presets_out/Iride6D-preset-pellicole.zip rel/
          awk -v v="$V" 'index($0, "## " v " ")==1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo "**Aggiornare:** dalla 1.4 in poi basta \`iride.mo\` nella cartella \`ML/modules\` della scheda; da una 1.3 o precedente copia anche \`autoexec.bin\` (Magic Lantern modificato per Iride). Impostazioni e rullini restano."
            echo
            echo "**Prima installazione:** firmware Canon 1.1.6, poi il contenuto di \`Iride6D-$V-SD.zip\` nella radice della scheda (vedi LEGGIMI.txt)."
            echo
            echo "**Preset pellicola:** \`Iride6D-preset-pellicole.zip\` per LightCraft e Lightroom (Importa predefiniti)."
          } >> notes.md
      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::La release $TAG esiste gia': aumenta IRIDE_VERSION in iride.c"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release gia' creata dal sito: aggiungiamo i file, e le note se e' vuota
            gh release upload "$TAG" rel/* --clobber
            if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            # dal clic su Run workflow: il tag nasce qui, sul commit appena compilato
            gh release create "$TAG" rel/* --target "$GITHUB_SHA" --title "Iride 6D ${TAG#[vV]}" --notes-file notes.md --latest
          fi

name: Demo nel browser

# Compila Iride + simulatore in WebAssembly e pubblica site/ su GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "simulator/**", "module/iride/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Emscripten
        run: sudo apt-get update && sudo apt-get install -y emscripten
      - name: Compila la demo (WebAssembly)
        run: sh simulator/web/build.sh ../site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
